function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function weightedPick(w){const t=w.reduce((a,b)=>a+b,0);if(!t)return 0;let r=Math.random()*t;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return w.length-1;}

// Build a card from a question with a random type
// Types: jte (JP→EN meaning), etj (EN→JP word)
function makeCard(q, quizMode, allQs){
  const type = quizMode==="jte" ? "jte" : quizMode==="etj" ? "etj" : (Math.random()<0.5?"jte":"etj");
  const jpLabel = q.k ? `${q.jp}（${q.k}）` : q.jp;
  const notSureOpt = {label:"🤷 わからない — Not sure", correct:false, notSure:true};
  if(type==="jte"){
    // Show JP → pick meaning
    const opts = shuffle([
      {label:q.m, correct:true},
      {label:q.d1m, correct:false},
      {label:q.d2m, correct:false},
      {label:q.d3m, correct:false},
    ]);
    opts.push(notSureOpt);
    return {type, opts, ans:opts.findIndex(o=>o.correct)};
  } else {
    // Show EN meaning → pick JP word
    const d1 = q.d1k ? `${q.d1jp}（${q.d1k}）` : q.d1jp;
    const d2 = q.d2k ? `${q.d2jp}（${q.d2k}）` : q.d2jp;
    const d3 = q.d3k ? `${q.d3jp}（${q.d3k}）` : q.d3jp;
    const opts = shuffle([
      {label:jpLabel, correct:true},
      {label:d1, correct:false},
      {label:d2, correct:false},
      {label:d3, correct:false},
    ]);
    opts.push(notSureOpt);
    return {type, opts, ans:opts.findIndex(o=>o.correct)};
  }
}

function buildDeck(pool, globalLog, quizMode){
  return pool.map(q=>{
    const e=globalLog[q.id];
    let status="unseen";
    if(e?.totalWrongs>0) status="redemption";
    else if(e?.mastered) status="inPool";
    const card=makeCard(q, quizMode, pool);
    return {
      qid:q.id, status, cardType:card.type,
      opts:card.opts, ans:card.ans,
      wrongCount:status==="redemption"?(e?.totalWrongs||1):0,
      streakNeeded:status==="redemption"?(e?.totalWrongs||1):0,
      streakCurrent:0,
    };
  });
}

function pickNext(deck,lastQid){
  const el=deck.map((c,i)=>({c,i})).filter(({c})=>c.status!=="mastered"&&c.status!=="deferred");
  if(!el.length)return -1;
  const w=el.map(({c})=>c.status==="redemption"?50:c.status==="unseen"?20:5);
  const li=el.findIndex(({c})=>c.qid===lastQid);
  if(li!==-1&&el.length>1)w[li]=0;
  return el[weightedPick(w)].i;
}

function processAnswer(deck,idx,correct){
  return deck.map((c,i)=>{
    if(i!==idx)return c;
    const card={...c};
    if(correct){
      if(card.status==="redemption"){
        card.streakCurrent++;
        if(card.streakCurrent>=card.streakNeeded){card.status="mastered";card.wrongCount=0;card.streakCurrent=0;card.streakNeeded=0;}
      } else {card.status="mastered";}
    } else {
      card.wrongCount++;card.streakNeeded=card.wrongCount;card.streakCurrent=0;card.status="deferred";
    }
    return card;
  });
}

.cbtn{background:transparent;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.45);padding:10px 16px;border-radius:22px;cursor:pointer;font-size:.82rem;white-space:nowrap;flex-shrink:0;transition:all .15s;}
@media (hover:hover){.cbtn:hover{border-color:#38bdf8;color:#38bdf8;}}
.cbtn.on{background:#38bdf8;border-color:#38bdf8;color:#0f0e17;font-weight:700;}
.card{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:24px 20px;margin-bottom:14px;}
.opt{width:100%;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.85);padding:14px 16px;min-height:56px;border-radius:12px;cursor:pointer;font-size:1rem;text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:all .16s;line-height:1.4;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;}
@media (hover:hover){.opt:hover:not(:disabled){border-color:#38bdf8;background:rgba(56,189,248,0.07);}}
.opt:disabled{cursor:default;}
.opt.correct{background:rgba(74,222,128,0.1);border-color:#4ade80;color:#4ade80;}
.opt.wrong{background:rgba(248,113,113,0.1);border-color:#f87171;color:#f87171;}
.opt.dim{opacity:.28;}
.lbl{width:28px;height:28px;border-radius:5px;background:rgba(255,255,255,0.08);font-size:.73rem;font-family:'JetBrains Mono',monospace;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.opt.correct .lbl{background:#4ade80;color:#0f0e17;}
.opt.wrong .lbl{background:#f87171;color:#fff;}
.hint{background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.22);border-radius:8px;padding:11px 15px;font-size:.83rem;color:#7dd3fc;margin-top:4px;margin-bottom:12px;line-height:1.65;animation:popIn .2s ease;}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.pbar{height:3px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;margin-bottom:18px;}
.pfill{height:100%;background:linear-gradient(90deg,#38bdf8,#7dd3fc);border-radius:99px;transition:width .4s ease;}
.next-btn{background:#38bdf8;color:#0f0e17;border:none;width:100%;min-height:54px;padding:14px 26px;border-radius:12px;cursor:pointer;font-size:1.05rem;font-weight:700;margin-top:2px;font-family:'Syne',sans-serif;transition:all .15s;}
@media (hover:hover){.next-btn:hover{background:#7dd3fc;}}
.start-btn{background:#38bdf8;color:#0f0e17;border:none;padding:14px 36px;border-radius:10px;cursor:pointer;font-size:1rem;font-weight:700;font-family:'Syne',sans-serif;transition:all .2s;}
@media (hover:hover){.start-btn:hover{background:#7dd3fc;transform:translateY(-2px);}}
.ghost-btn{background:transparent;border:1px solid rgba(255,255,255,0.14);color:rgba(255,255,255,0.55);padding:10px 20px;border-radius:8px;cursor:pointer;font-size:.86rem;font-weight:600;transition:all .15s;}
@media (hover:hover){.ghost-btn:hover{border-color:#38bdf8;color:#38bdf8;}}
.danger-btn{background:transparent;border:1px solid rgba(248,113,113,0.3);color:#f87171;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:.78rem;}
.slabel{font-size:.68rem;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,0.22);margin-bottom:10px;font-family:'JetBrains Mono',monospace;}
.chip{font-size:.68rem;border-radius:4px;padding:2px 7px;white-space:nowrap;}
.chip-blue{background:rgba(56,189,248,0.12);color:#38bdf8;}
.chip-red{background:rgba(248,113,113,0.12);color:#f87171;}
.chip-green{background:rgba(74,222,128,0.1);color:#4ade80;}
.chip-gray{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);}
.chip-yellow{background:rgba(250,204,21,0.1);color:#facc15;}
.chip-purple{background:rgba(167,139,250,0.12);color:#a78bfa;}
.chip-pink{background:rgba(244,114,182,0.1);color:#f472b6;}
.chip-orange{background:rgba(251,146,60,0.1);color:#fb923c;}
.rring{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 18px;border:3px solid;}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:8px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.055);margin-bottom:6px;}
.streak-dots{display:flex;gap:4px;margin-top:6px;}
.dot{width:8px;height:8px;border-radius:50%;}
.dot-filled{background:#4ade80;}.dot-empty{background:rgba(255,255,255,0.15);}.dot-needed{background:#f87171;opacity:.5;}
input[type=text]{outline:none;font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;}
input[type=text]:focus{border-color:#38bdf8!important;}
/* ── touch ── */
button{min-height:44px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
input[type=text]{font-size:16px!important;min-height:46px;}
button:not(:disabled):active{transform:scale(.97);opacity:.85;}
.opt{transition:transform .08s,background .16s,border-color .16s;}
.topbar .ghost-btn{min-width:44px;}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.btnrow>button{flex:1 1 140px;}
.toggles{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
.toggles>button{flex:1 1 0;min-width:0;white-space:nowrap;}
`;


const { useState, useEffect, useCallback, useRef, useMemo } = React;
const STORAGE_KEY = "genki-srs-v1";
const LESSONS = ["All",...new Set(QUESTIONS.map(q=>q.l))];
const LESSON_NUMS=[...new Set(QUESTIONS.map(q=>{const m=q.l.match(/L(\d+)/);return m?parseInt(m[1]):null;}).filter(Boolean))].sort((a,b)=>a-b);
function qMatchesLesson(q,num){const m=q.l.match(/L(\d+)/);return m&&parseInt(m[1])===num;}
// Pre-computed map: question id -> lesson number (avoids regex in filter loop)
const Q_LESSON_NUM={};
QUESTIONS.forEach(q=>{const m=q.l.match(/L(\d+)/);if(m)Q_LESSON_NUM[q.id]=parseInt(m[1]);});
const POS_TYPES = ["All","n","u-v","ru-v","irr-v","i-adj","na-adj","adv","exp"];
const POS_LABELS = {n:"Noun","u-v":"う-verb","ru-v":"る-verb","irr-v":"Irreg. verb","i-adj":"い-adj","na-adj":"な-adj",adv:"Adverb",exp:"Expression"};
const POS_CHIPS = {n:"chip-gray","u-v":"chip-yellow","ru-v":"chip-blue","irr-v":"chip-pink","i-adj":"chip-green","na-adj":"chip-purple",adv:"chip-orange",exp:"chip-gray"};

function GenkiQuiz(){
  const [lessons,setLessons]=useState([]);
  const [posFilters,setPosFilters]=useState([]);
  const [quizMode,setQuizMode]=useState("jte");
  const [phase,setPhase]=useState("start");
  const [pool,setPool]=useState([]);
  const [deck,setDeck]=useState([]);
  const [cardIdx,setCardIdx]=useState(0);
  const [chosen,setChosen]=useState(null);
  const [sessionLog,setSessionLog]=useState([]);
  const [totalCorrect,setTotalCorrect]=useState(0);
  const [totalAnswered,setTotalAnswered]=useState(0);
  const lastQidRef=useRef(null);
  const [globalLog,setGlobalLog]=useState({});
  const [storageReady,setStorageReady]=useState(false);

  useEffect(()=>{
    try{const v=localStorage.getItem(STORAGE_KEY);if(v)setGlobalLog(JSON.parse(v));}catch{}
    setStorageReady(true);
  },[]);
  useEffect(()=>{
    if(!storageReady)return;
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(globalLog));}catch{}
  },[globalLog,storageReady]);

  const updateLog=useCallback((qid,correct)=>{
    setGlobalLog(p=>({...p,[qid]:{
      totalWrongs:(p[qid]?.totalWrongs||0)+(correct?0:1),
      totalAttempts:(p[qid]?.totalAttempts||0)+1,
      lastSeen:Date.now(),
      mastered:correct?true:false,
    }}));
  },[]);

  const clearLog=useCallback(()=>{
    if(window.confirm("Clear all progress?")){setGlobalLog({});try{localStorage.removeItem(STORAGE_KEY);}catch{}}
  },[]);

  const filteredPool = useCallback(()=>{
    let q=QUESTIONS;
    if(lessons.length>0){
      const ids=new Set(q.filter(w=>LESSON_NUMS.some(n=>lessons.includes(n)&&qMatchesLesson(w,n))).map(w=>w.id));
      q=q.filter(w=>ids.has(w.id));
    }
    if(posFilters.length>0) q=q.filter(w=>posFilters.includes(w.pos));
    return q;
  },[lessons,posFilters]);

  const startSession=useCallback((weakOnly=false)=>{
    let fp=filteredPool();
    if(weakOnly){
      const wids=Object.entries(globalLog).filter(([,v])=>v.totalWrongs>0).map(([id])=>id);
      fp=QUESTIONS.filter(q=>wids.includes(q.id));
      if(!fp.length)return;
    }
    const sp=shuffle(fp).slice(0,Math.min(fp.length,30));
    const nd=buildDeck(sp,globalLog,quizMode);
    setPool(sp);setDeck(nd);setCardIdx(pickNext(nd,null));
    setChosen(null);setSessionLog([]);setTotalCorrect(0);setTotalAnswered(0);
    lastQidRef.current=null;setPhase("quiz");
  },[filteredPool,globalLog,quizMode]);

  const pick=useCallback((optIdx)=>{
    if(chosen!==null||cardIdx<0)return;
    const card=deck[cardIdx];
    const q=pool[cardIdx];
    const correct=optIdx===card.ans;
    setChosen(optIdx);
    setTotalAnswered(a=>a+1);
    if(correct)setTotalCorrect(c=>c+1);
    updateLog(q.id,correct);
    setDeck(processAnswer(deck,cardIdx,correct));
    setSessionLog(l=>[...l,{q,chosen:optIdx,ok:correct,type:card.cardType}]);
  },[chosen,cardIdx,pool,deck,updateLog]);

  const next=useCallback(()=>{
    lastQidRef.current=pool[cardIdx]?.id??null;
    const ni=pickNext(deck,lastQidRef.current);
    if(ni===-1){setPhase("complete");return;}
    setCardIdx(ni);setChosen(null);
  },[cardIdx,deck,pool]);

  const cQ=pool[cardIdx];
  const cC=deck[cardIdx];
  const masteredCount=deck.filter(c=>c.status==="mastered").length;
  const deferredCount=deck.filter(c=>c.status==="deferred").length;
  const redemptionCount=deck.filter(c=>c.status==="redemption").length;
  const unseenCount=deck.filter(c=>c.status==="unseen").length;
  const pct=totalAnswered>0?Math.round(totalCorrect/totalAnswered*100):0;
  const ringColor=pct>=80?"#4ade80":pct>=55?"#facc15":"#f87171";
  const topMistakes=Object.entries(globalLog).filter(([,v])=>v.totalWrongs>0).sort((a,b)=>b[1].totalWrongs-a[1].totalWrongs).slice(0,50);
  const seenCount=Object.values(globalLog).filter(v=>v.totalAttempts>0).length;
  const fp=filteredPool();

  return (
    <div style={{minHeight:"100vh",background:"#0f0e17",color:"#fffffe",fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"}}>
      <style>{CSS_CONTENT}</style>
      <div className="wrap">

        {/* TOPBAR */}
        <div className="topbar">
          <div className="logo">Genki 語彙 · SRS</div>
          <div style={{display:"flex",gap:8}}>
            <button className="ghost-btn" style={{padding:"8px 12px",fontSize:".8rem"}} onClick={()=>setPhase("words")}>📋 Words</button>
            <button className="ghost-btn" style={{padding:"8px 12px",fontSize:".8rem"}} onClick={()=>setPhase("log")}>
              {topMistakes.length>0?`⚠️ ${topMistakes.length} weak`:"📊 Log"}
            </button>
          </div>
        </div>

        {/* LESSON + POS FILTER */}
        {(phase==="start"||phase==="log")&&(<>
          <div className="cscroll">
            <button className={`cbtn ${lessons.length===0?"on":""}`} onClick={()=>setLessons([])}>All</button>
            {LESSON_NUMS.map(n=>(
              <button key={n} className={`cbtn ${lessons.includes(n)?"on":""}`}
                onClick={()=>setLessons(prev=>prev.includes(n)?prev.filter(x=>x!==n):[...prev,n])}>
                L{n}
              </button>
            ))}
          </div>
          <div className="cscroll">
            <button className={`cbtn ${posFilters.length===0?"on":""}`} onClick={()=>setPosFilters([])}>All POS</button>
            {POS_TYPES.filter(p=>p!=="All").map(p=>(
              <button key={p} className={`cbtn ${posFilters.includes(p)?"on":""}`}
                onClick={()=>setPosFilters(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p])}>
                {POS_LABELS[p]||p}
              </button>
            ))}
          </div>
        </>)}

        {/* ════ START ════ */}
        {phase==="start"&&(
          <div className="card" style={{textAlign:"center",padding:"36px 22px"}}>
            <div style={{fontSize:"2.6rem",marginBottom:12}}>語彙</div>
            <p style={{color:"rgba(255,255,255,0.38)",fontSize:".9rem",lineHeight:1.8,marginBottom:6}}>
              {fp.length} words{lessons.length>0?` · L${lessons.slice().sort((a,b)=>a-b).join(", L")}`:""}
              {posFilters.length>0?` · ${posFilters.map(p=>POS_LABELS[p]||p).join(", ")}`:" "} · up to 30 per session
            </p>
            <p style={{color:"rgba(255,255,255,0.22)",fontSize:".78rem",lineHeight:1.7,marginBottom:16,maxWidth:380,margin:"0 auto 16px"}}>
              J→E: see Japanese → pick meaning.<br/>
              E→J: see meaning → pick Japanese word.
            </p>
            <div className="toggles">
              {[["jte","🇯🇵 J→E"],["etj","🇬🇧 E→J"],["mixed","🔀 Mixed"]].map(([m,label])=>(
                <button key={m} onClick={()=>setQuizMode(m)} style={{
                  background:quizMode===m?"#38bdf8":"transparent",
                  border:`1px solid ${quizMode===m?"#38bdf8":"rgba(255,255,255,0.15)"}`,
                  color:quizMode===m?"#0f0e17":"rgba(255,255,255,0.5)",
                  padding:"10px 10px",borderRadius:22,cursor:"pointer",fontSize:".82rem",fontWeight:quizMode===m?700:400,
                }}>{label}</button>
              ))}
            </div>
            <div className="btnrow">
              <button className="start-btn" onClick={()=>startSession(false)}>スタート START →</button>
              {topMistakes.length>0&&<button className="ghost-btn" onClick={()=>startSession(true)}>⚠️ Weak Only</button>}
            </div>
            {seenCount>0&&(
              <div style={{marginTop:20,display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap"}}>
                <span className="chip chip-green">{seenCount}/{QUESTIONS.length} seen</span>
                <span className="chip chip-red">{topMistakes.length} with mistakes</span>
                <span className="chip chip-gray">{Object.values(globalLog).reduce((a,v)=>a+v.totalAttempts,0)} attempts</span>
              </div>
            )}
          </div>
        )}

        {/* ════ QUIZ ════ */}
        {phase==="quiz"&&cQ&&cC&&(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
              <span style={{fontSize:".72rem",color:"rgba(255,255,255,0.28)",fontFamily:"JetBrains Mono,monospace"}}>
                {masteredCount}/{deck.length} mastered{deferredCount>0?` · ${deferredCount} deferred`:""}
                {deferredCount>0&&<span className="chip chip-gray">⏭ {deferredCount} next session</span>}
              </span>
              <div style={{display:"flex",gap:7,alignItems:"center"}}>
                {redemptionCount>0&&<span className="chip chip-red">🔁 {redemptionCount}</span>}
                {unseenCount>0&&<span className="chip chip-gray">{unseenCount} new</span>}
              </div>
            </div>
            <div className="pbar"><div className="pfill" style={{width:`${deck.length>0?((masteredCount+deferredCount)/deck.length)*100:0}%`}}/></div>

            <div className="card">
              {/* Badges */}
              <div style={{display:"flex",gap:7,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
                <span className={`chip ${POS_CHIPS[cQ.pos]||"chip-gray"}`}>{cQ.pl}</span>
                <span className="chip chip-gray">{cQ.l}</span>
                {cC.cardType==="etj"&&<span className="chip chip-gray">🇬🇧→🇯🇵</span>}
                {cC.cardType==="jte"&&quizMode==="mixed"&&<span className="chip chip-gray">🇯🇵→🇬🇧</span>}
                {cC.status==="redemption"&&<span className="chip chip-red">🔁 need {cC.streakNeeded-cC.streakCurrent} ✓</span>}
                {cC.status==="unseen"&&<span className="chip chip-gray">✨ New</span>}
              </div>

              {/* Question display */}
              {cC.cardType==="jte" ? (
                <>
                  <div style={{fontSize:"2.5rem",textAlign:"center",letterSpacing:".06em",padding:"6px 0 2px",fontWeight:300,fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"}}>{cQ.jp}</div>
                  {cQ.k&&<div style={{fontSize:"1rem",textAlign:"center",color:"rgba(255,255,255,0.35)",marginBottom:6,letterSpacing:".04em"}}>{cQ.k}</div>}
                  {cQ.ctx&&<div style={{fontSize:".82rem",textAlign:"center",color:"#7dd3fc",marginBottom:10,fontStyle:"italic"}}>{cQ.ctx}</div>}
                  <div style={{fontSize:".88rem",textAlign:"center",color:"rgba(255,255,255,0.5)",marginBottom:18}}>What does this mean?</div>
                </>
              ):(
                <>
                  <div style={{fontSize:".72rem",textTransform:"uppercase",letterSpacing:".12em",color:"rgba(255,255,255,0.22)",textAlign:"center",marginBottom:10}}>Which Japanese means…</div>
                  <div style={{fontSize:"1.4rem",textAlign:"center",padding:"8px 0 4px",fontWeight:500,color:"#7dd3fc",lineHeight:1.4}}>{cQ.m}</div>
                  {cQ.ctx&&<div style={{fontSize:".82rem",textAlign:"center",color:"rgba(255,255,255,0.3)",marginBottom:6,fontStyle:"italic"}}>{cQ.ctx}</div>}
                  <div style={{fontSize:".78rem",textAlign:"center",color:"rgba(255,255,255,0.3)",marginBottom:18}}>{cQ.pl}</div>
                </>
              )}

              {/* Options */}
              {cC.opts.map((opt,i)=>{
                const isNotSure = opt.notSure;
                let cls="";
                if(chosen!==null){
                  if(i===cC.ans)cls="correct";
                  else if(i===chosen)cls="wrong";
                  else cls="dim";
                }
                return(
                  <button key={i} className={`opt ${cls}`}
                    style={isNotSure?{opacity:chosen===null?0.5:undefined,borderStyle:"dashed",fontSize:".92rem"}:{}}
                    onClick={()=>pick(i)} disabled={chosen!==null}>
                    <span className="lbl">{["a","b","c","d","?"][i]}</span>
                    {opt.label}
                    {chosen!==null&&i===cC.ans&&<span style={{marginLeft:"auto"}}>✓</span>}
                    {chosen!==null&&i===chosen&&i!==cC.ans&&<span style={{marginLeft:"auto"}}>✗</span>}
                  </button>
                );
              })}

              {chosen!==null&&(
                <>
                  <div className="hint">
                    💡 <strong>{cQ.jp}{cQ.k?`（${cQ.k}）`:""}</strong> = {cQ.m}
                    {cQ.ctx&&` · e.g. ${cQ.ctx}`}
                    {" · "}{cQ.pl} · {cQ.l}
                  </div>
                  {chosen!==cC.ans&&(
                    <div style={{fontSize:".8rem",color:"rgba(255,255,255,0.4)",marginBottom:4}}>
                      Deferred — need {cC.wrongCount} consecutive ✓ to redeem
                      <div className="streak-dots">{Array.from({length:cC.wrongCount}).map((_,i)=><div key={i} className="dot dot-needed"/>)}</div>
                    </div>
                  )}
                  {chosen===cC.ans&&cC.status==="redemption"&&deck[cardIdx]?.streakCurrent>0&&(
                    <div style={{fontSize:".8rem",color:"#4ade80",marginBottom:4}}>
                      Streak: {deck[cardIdx].streakCurrent}/{deck[cardIdx].streakNeeded} ✓
                      <div className="streak-dots">{Array.from({length:deck[cardIdx].streakNeeded}).map((_,i)=><div key={i} className={`dot ${i<deck[cardIdx].streakCurrent?"dot-filled":"dot-empty"}`}/>)}</div>
                    </div>
                  )}
                </>
              )}
            </div>

            {chosen!==null&&(
              <div style={{marginBottom:6}}>
                <button className="next-btn" onClick={next}>
                  {redemptionCount===0&&unseenCount===0&&(masteredCount+deferredCount)===deck.length?"完了 Done 🎉":"次へ Next →"}
                </button>
              </div>
            )}
          </>
        )}

        {/* ════ COMPLETE ════ */}
        {phase==="complete"&&(
          <>
            <div className="card" style={{textAlign:"center",padding:"32px 20px"}}>
              <div className="rring" style={{borderColor:ringColor,color:ringColor}}>
                <span style={{fontSize:"1.7rem",fontFamily:"JetBrains Mono,monospace",fontWeight:700}}>{pct}%</span>
                <span style={{fontSize:".68rem",color:"rgba(255,255,255,0.28)",marginTop:1}}>{totalCorrect}/{totalAnswered}</span>
              </div>
              <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"1.35rem",fontWeight:700,marginBottom:6}}>
                {pct>=90?"完璧！Perfect!":pct>=70?"よくできました！Great!":"もっと練習！Keep going!"}
              </h2>
              <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap",marginTop:14}}>
                <span className="chip chip-green">✓ {totalCorrect}</span>
                <span className="chip chip-red">✗ {totalAnswered-totalCorrect}</span>
                <span className="chip chip-gray">{totalAnswered} total</span>
              </div>
            </div>
            {sessionLog.filter(e=>!e.ok).length>0&&(
              <div className="card" style={{background:"rgba(248,113,113,0.04)",border:"1px solid rgba(248,113,113,0.12)"}}>
                <div className="slabel">Deferred this session</div>
                {[...new Map(sessionLog.filter(e=>!e.ok).map(e=>[e.q.id,e])).values()].map((e,i)=>(
                  <div key={i} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 10px",borderRadius:7,marginBottom:5,background:"rgba(248,113,113,0.06)"}}>
                    <span style={{fontSize:"1.1rem",minWidth:52}}>{e.q.jp}</span>
                    <div style={{flex:1}}>
                      <span style={{fontSize:".85rem",fontWeight:600,color:"rgba(255,255,255,0.8)"}}>{e.q.k||""}</span>
                      <span style={{color:"rgba(255,255,255,0.45)",marginLeft:8,fontSize:".8rem"}}>= {e.q.m}</span>
                    </div>
                    <span className={`chip ${POS_CHIPS[e.q.pos]||"chip-gray"}`} style={{fontSize:".64rem"}}>{e.q.pl}</span>
                  </div>
                ))}
              </div>
            )}
            <div className="btnrow">
              <button className="start-btn" onClick={()=>startSession(false)}>もう一度</button>
              {topMistakes.length>0&&<button className="ghost-btn" onClick={()=>startSession(true)}>⚠️ Weak Only</button>}
              <button className="ghost-btn" onClick={()=>setPhase("start")}>← Back</button>
            </div>
          </>
        )}

        {/* ════ LOG ════ */}
        {phase==="log"&&(
          <>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
              <div>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"1.05rem"}}>📊 Mistake Log</div>
                <div style={{fontSize:".76rem",color:"rgba(255,255,255,0.3)",marginTop:3}}>{Object.values(globalLog).reduce((a,v)=>a+v.totalAttempts,0)} total attempts</div>
              </div>
              {topMistakes.length>0&&<button className="danger-btn" onClick={clearLog}>Clear all</button>}
            </div>
            {topMistakes.length===0?(
              <div className="card" style={{textAlign:"center",padding:"36px",color:"rgba(255,255,255,0.28)"}}>
                <div style={{fontSize:"2rem",marginBottom:10}}>🎉</div>No mistakes yet!
              </div>
            ):(
              <>
                <div style={{display:"flex",gap:9,marginBottom:14,flexWrap:"wrap"}}>
                  <button className="start-btn" style={{fontSize:".86rem",padding:"10px 20px"}} onClick={()=>startSession(true)}>Quiz Weak ({Math.min(topMistakes.length,30)})</button>
                  <button className="ghost-btn" onClick={()=>setPhase("start")}>← Back</button>
                </div>
                <div className="card" style={{padding:"16px"}}>
                  <div className="slabel">Sorted by mistakes</div>
                  {topMistakes.map(([id,data])=>{
                    const q=QUESTIONS.find(q=>q.id===id);if(!q)return null;
                    const acc=data.totalAttempts>0?Math.round(((data.totalAttempts-data.totalWrongs)/data.totalAttempts)*100):0;
                    return(
                      <div key={id} className="mrow">
                        <div style={{fontSize:"1.1rem",minWidth:52,fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"}}>{q.jp}</div>
                        <div style={{flex:1}}>
                          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                            <span style={{fontSize:".86rem",fontWeight:600,color:"rgba(255,255,255,0.82)"}}>{q.k||q.jp}</span>
                            <span className={`chip ${POS_CHIPS[q.pos]||"chip-gray"}`} style={{fontSize:".64rem"}}>{q.pl}</span>
                          </div>
                          <div style={{fontSize:".82rem",color:"rgba(255,255,255,0.5)",marginTop:2}}>= {q.m}</div>
                          <div style={{fontSize:".72rem",color:"rgba(255,255,255,0.25)",marginTop:2}}>{data.totalAttempts} attempts · {acc}%</div>
                        </div>
                        <span style={{fontFamily:"JetBrains Mono,monospace",fontSize:".73rem",background:"rgba(248,113,113,0.14)",color:"#f87171",borderRadius:4,padding:"3px 7px"}}>✗ {data.totalWrongs}</span>
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </>
        )}

        {/* ════ WORDS ════ */}
        {phase==="words"&&<WordList globalLog={globalLog} onBack={()=>setPhase("start")} posChips={POS_CHIPS} posLabels={POS_LABELS}/>}

      </div>
    </div>
  );
}

function WordList({globalLog,onBack,posChips,posLabels}){
  const [searchRaw,setSearchRaw]=useState("");
  const [search,setSearch]=useState("");
  const [filter,setFilter]=useState("all");
  const [posF,setPosF]=useState([]);
  const [lessonF,setLessonF]=useState([]);

  // Debounce search — only refilter 200ms after typing stops
  useEffect(()=>{
    const t=setTimeout(()=>setSearch(searchRaw),200);
    return()=>clearTimeout(t);
  },[searchRaw]);

  // Seen count — only recomputes when globalLog changes
  const seenCount=useMemo(()=>
    QUESTIONS.filter(q=>globalLog[q.id]?.totalAttempts>0).length
  ,[globalLog]);

  // Full filtered+deduped list — only recomputes when filters change
  const deduped=useMemo(()=>{
    const s=search.toLowerCase();
    const lessonSet=new Set(lessonF); // O(1) lookup
    const posSet=new Set(posF);
    const seen=new Set();
    return QUESTIONS.filter(q=>{
      if(seen.has(q.id))return false;
      const ms=!s||q.jp.includes(s)||q.k.includes(s)||q.m.toLowerCase().includes(s);
      const mp=posSet.size===0||posSet.has(q.pos);
      const ml=lessonSet.size===0||lessonSet.has(Q_LESSON_NUM[q.id]);
      const e=globalLog[q.id];
      const wasSeen=e?.totalAttempts>0;
      const weak=e?.totalWrongs>0;
      const mf=filter==="all"?true:filter==="seen"?wasSeen:filter==="unseen"?!wasSeen:weak;
      if(ms&&mp&&ml&&mf){seen.add(q.id);return true;}
      return false;
    });
  },[search,posF,lessonF,filter,globalLog]);

  return(
    <>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:"1.05rem"}}>📋 Word List</div>
          <div style={{fontSize:".74rem",color:"rgba(255,255,255,0.3)",marginTop:3}}>
            {seenCount}/{QUESTIONS.length} words seen
          </div>
        </div>
        <button className="ghost-btn" style={{padding:"8px 14px",fontSize:".8rem"}} onClick={onBack}>← Back</button>
      </div>
      <input type="text" placeholder="Search kana, kanji or meaning…" value={searchRaw} onChange={e=>setSearchRaw(e.target.value)}
        style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"12px 14px",color:"#fff",fontSize:16,marginBottom:10}}/>
      <div className="cscroll" style={{marginBottom:8}}>
        <button className={`cbtn ${lessonF.length===0?"on":""}`} onClick={()=>setLessonF([])}>All</button>
        {LESSON_NUMS.map(n=>(
          <button key={n} className={`cbtn ${lessonF.includes(n)?"on":""}`}
            onClick={()=>setLessonF(prev=>prev.includes(n)?prev.filter(x=>x!==n):[...prev,n])}>
            L{n}
          </button>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
        <button onClick={()=>setPosF([])} style={{background:posF.length===0?"#38bdf8":"transparent",border:`1px solid ${posF.length===0?"#38bdf8":"rgba(255,255,255,0.1)"}`,color:posF.length===0?"#0f0e17":"rgba(255,255,255,0.45)",padding:"10px 15px",borderRadius:22,cursor:"pointer",fontSize:".8rem",fontWeight:posF.length===0?700:400}}>All</button>
        {["n","u-v","ru-v","irr-v","i-adj","na-adj","adv","exp"].map(p=>(
          <button key={p} onClick={()=>setPosF(prev=>prev.includes(p)?prev.filter(x=>x!==p):[...prev,p])} style={{
            background:posF.includes(p)?"#38bdf8":"transparent",
            border:`1px solid ${posF.includes(p)?"#38bdf8":"rgba(255,255,255,0.1)"}`,
            color:posF.includes(p)?"#0f0e17":"rgba(255,255,255,0.45)",
            padding:"10px 15px",borderRadius:22,cursor:"pointer",fontSize:".8rem",fontWeight:posF.includes(p)?700:400,
          }}>{posLabels[p]||p}</button>
        ))}
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        {[["all","All"],["unseen","Unseen"],["seen","Seen"],["weak","Weak ⚠️"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} style={{
            background:filter===v?"#38bdf8":"transparent",
            border:`1px solid ${filter===v?"#38bdf8":"rgba(255,255,255,0.1)"}`,
            color:filter===v?"#0f0e17":"rgba(255,255,255,0.45)",
            padding:"10px 15px",borderRadius:22,cursor:"pointer",fontSize:".8rem",fontWeight:filter===v?700:400,
          }}>{l}</button>
        ))}
      </div>
      <div style={{fontSize:".72rem",color:"rgba(255,255,255,0.25)",marginBottom:10,fontFamily:"JetBrains Mono,monospace"}}>{deduped.length} words</div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {deduped.map((q,i)=>{
          const e=globalLog[q.id];
          const wasSeen=e?.totalAttempts>0;
          const weak=e?.totalWrongs>0;
          const acc=e?.totalAttempts>0?Math.round(((e.totalAttempts-e.totalWrongs)/e.totalAttempts)*100):null;
          let dot="○",dc="rgba(255,255,255,0.18)";
          if(weak){dot="✗";dc="#f87171";}else if(wasSeen){dot="✓";dc="#4ade80";}
          return(
            <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"9px 13px",borderRadius:8,background:"rgba(255,255,255,0.025)",border:"1px solid rgba(255,255,255,0.05)"}}>
              <span style={{fontSize:"1rem",color:dc,fontFamily:"JetBrains Mono,monospace",minWidth:16,textAlign:"center"}}>{dot}</span>
              <div style={{fontSize:"1.2rem",minWidth:52,fontFamily:"'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif"}}>{q.jp}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",gap:6,alignItems:"baseline",flexWrap:"wrap"}}>
                  <span style={{fontSize:".86rem",fontWeight:600,color:"rgba(255,255,255,0.8)"}}>{q.k||q.jp}</span>
                  <span style={{fontSize:".78rem",color:"rgba(255,255,255,0.38)"}}>= {q.m}</span>
                </div>
                <div style={{display:"flex",gap:5,marginTop:4,alignItems:"center",flexWrap:"wrap"}}>
                  <span className={`chip ${posChips[q.pos]||"chip-gray"}`}>{q.pl}</span>
                  <span className="chip chip-gray" style={{fontSize:".62rem"}}>{q.l}</span>
                  {q.ctx&&<span style={{fontSize:".7rem",color:"rgba(255,255,255,0.28)",fontStyle:"italic"}}>{q.ctx}</span>}
                </div>
              </div>
              {e?.totalAttempts>0&&(
                <div style={{textAlign:"right",flexShrink:0}}>
                  {weak&&<div style={{fontSize:".7rem",color:"#f87171",fontFamily:"JetBrains Mono,monospace"}}>✗{e.totalWrongs}</div>}
                  {acc!==null&&<div style={{fontSize:".68rem",color:"rgba(255,255,255,0.22)"}}>{acc}%</div>}
                </div>
              )}
            </div>
          );
        })}
      </div>
      {deduped.length===0&&<div style={{textAlign:"center",color:"rgba(255,255,255,0.25)",padding:"40px 0",fontSize:".88rem"}}>No words match</div>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<GenkiQuiz />);

</script>
</body>
</html>
